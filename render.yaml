# Blueprint Render : un seul service, aucune variable a renseigner.
# Render > New > Blueprint, puis pointer sur ce depot.
services:
  - type: web
    name: baccalaureat
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
