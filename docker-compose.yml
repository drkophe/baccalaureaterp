name: baccalaureat

services:
  redis:
    image: redis:7-alpine
    # Les sessions sont ephemeres et deja protegees par un TTL : pas besoin de
    # persistance disque, mais on borne la memoire pour ne jamais saturer l'hote.
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: bacc
      ALLOW_MEMORY_STORE: 'false'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 1
    ports:
      - '4000:4000'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Monter a plusieurs instances est sans effet de bord : l'etat vit dans Redis
    # et l'adapter Socket.io relaie les evenements entre les replicas.
    #   docker compose up --scale server=3
    # (retirer le mapping de ports ci-dessus et placer un load balancer devant)

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:4000}
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      - server
    restart: unless-stopped
